http {
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        # Применяем ограничение запросов
        limit_req zone=req_limit burst=0 nodelay;
        limit_req_status 429; # Устанавливаем код ошибки при превышении лимита

        location / {
            proxy_pass http://backend_servers;
        }

        # Можно добавить отдельную обработку ошибки 429
        error_page 429 /429.html;
        location = /429.html {
            internal;
            return 429 "Too Many Requests\n";
        }
    }
}
